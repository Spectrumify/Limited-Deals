<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limited Deals</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Limited Deals</h1>
    <span class="muted">Budget: {{ budget }} R$</span>
    <span id="status" class="muted">Loading…</span>
  </header>

  <main>
    <section id="filters" class="panel">
      <label>Price min <input type="number" id="f-min-price" min="0" step="50"></label>
      <label>Price max <input type="number" id="f-max-price" min="0" step="50"></label>
      <label>Min demand
        <select id="f-min-demand">
          <option value="">Any</option>
          <option value="1">Low+</option>
          <option value="2">Normal+</option>
          <option value="3">High+</option>
          <option value="4">Amazing</option>
        </select>
      </label>
      <fieldset>
        <legend>Trend</legend>
        <label><input type="checkbox" class="f-trend" value="3"> Rising</label>
        <label><input type="checkbox" class="f-trend" value="2"> Stable</label>
        <label><input type="checkbox" class="f-trend" value="0"> Falling</label>
        <label><input type="checkbox" class="f-trend" value="1"> Unstable</label>
        <label><input type="checkbox" class="f-trend" value="4"> Fluctuating</label>
      </fieldset>
      <label>Max copies <input type="number" id="f-max-copies" min="0" step="100" title="Fewer copies = rarer"></label>
      <label><input type="checkbox" id="f-rare-only"> Rare only</label>
      <label><input type="checkbox" id="f-hide-projected"> Hide projected</label>

      <div class="presets">
        <select id="preset-select"><option value="">— Presets —</option></select>
        <button id="preset-save">Save as…</button>
        <button id="preset-delete">Delete</button>
        <button id="filters-clear">Clear filters</button>
      </div>
    </section>

    <p class="muted">
      Showing items with a live lowest price (RAP within 1.5× budget) that match the filters.
      <span id="count"></span> Click a column header to sort.
    </p>
    <div class="table-wrap">
      <table id="items">
        <thead>
          <tr>
            <th data-key="name">Item</th>
            <th data-key="lowest_price" class="num">Lowest price</th>
            <th data-key="rap" class="num">RAP</th>
            <th data-key="value" class="num">Value</th>
            <th data-key="demand">Demand</th>
            <th data-key="trend">Trend</th>
            <th data-key="total_quantity" class="num">Copies</th>
            <th data-key="flags">Flags</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
