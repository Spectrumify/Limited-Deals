name: Refresh data

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may start it a few minutes late)
  workflow_dispatch:        # the "Run workflow" button
    inputs:
      discord_test:
        description: "Also send a test message to Discord"
        type: boolean
        default: false

# The job may only change files in this repo. No other permissions.
permissions:
  contents: write

# Never run two refreshes at once.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits so a hijacked tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-job.txt

      - name: Install
        run: pip install -r requirements-job.txt

      - name: Refresh data
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TEST: ${{ inputs.discord_test }}
        run: python refresh_job.py

      # Only reached if the refresh step succeeded. If it skipped (a source was down),
      # it wrote nothing, so there is nothing to commit.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 10
          done
          exit 1
